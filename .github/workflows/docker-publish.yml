name: docker publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '0 3 */60 * *'
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches: [ main ]
  repository_dispatch:
    owner: 'baz-ga'
    repo: 'Edirom-Online'
    event_type: 'pre-release'
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # github repository name as <repo>
  #  might even be set through echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | sed -e "s/:refs//" if usernames on GitHub and DockerHub are identical
  #DOCKERHUB_IMAGE_NAME: docker-edirom-online

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
             
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          token: ${{ secrets.BAZGA_ACCESS }}

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v2.2.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login against DockerHub registry except on PR
      #- name: Log in to DockerHub
      #  if: github.event_name != 'pull_request'
      #  uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
      #  with:
      #    username: ${{ secrets.DOCKERHUB_USERNAME }}
      #    password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          #images: |
          #  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          #  ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          # on push output branch name as tag
          # on tag output git-tag-name as dockerimage-tag, e.g.: v1.2.3
          # on tag output v+major.minor dockerimage tag, e.g.: v1.2
          # on tag output major version at dockerimage-tag, e.g.: v1
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      # Build Docker image using build.sh script
      - name: Build Docker image
        id: build-image
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh

          # Build --tag flags from all metadata-action tags
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_ARGS+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)

          # Common build arguments
          COMMON_ARGS=(
            --secret type=env,id=GITHUB_API_TOKEN
            --build-arg EDIROM_OWNER=baz-ga
            --build-arg EDIROM_REF=bazga/candidate
            --build-arg EDIROM_VERSION_STRATEGY=2.0.0
            "${TAG_ARGS[@]}"
          )

          # For PRs: build only for amd64 with --load
          # For non-PRs: build multi-platform with --push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./build.sh "${COMMON_ARGS[@]}" --platform linux/amd64 --load
          else
            ./build.sh "${COMMON_ARGS[@]}" --platform linux/amd64,linux/arm64/v8 --push
          fi

          # Get the image digest for signing
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format "{{json .Manifest.Digest}}" | tr -d '"')
            echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          fi

      - name: Debug build outputs
        if: github.event_name != 'pull_request'
        run: |
          echo "Digest: ${{ steps.build-image.outputs.digest }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the images with GitHub OIDC Token
        if: github.event_name != 'pull_request' && steps.build-image.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build-image.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "Error: DIGEST is empty. Skipping signing."
            exit 1
          fi
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          echo "Signing images: ${images}"
          cosign sign --yes ${images}
