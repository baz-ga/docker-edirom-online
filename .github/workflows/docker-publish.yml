name: docker publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '0 3 */60 * *'
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches: [ main ]
  repository_dispatch:
    owner: 'baz-ga'
    repo: 'Edirom-Online'
    event_type: 'pre-release'
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # github repository name as <repo>
  #  might even be set through echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | sed -e "s/:refs//" if usernames on GitHub and DockerHub are identical
  #DOCKERHUB_IMAGE_NAME: docker-edirom-online

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
             
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive
          token: ${{ secrets.BAZGA_ACCESS }}

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
        with:
          cosign-release: 'v2.2.4'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login against DockerHub registry except on PR
      #- name: Log in to DockerHub
      #  if: github.event_name != 'pull_request'
      #  uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446
      #  with:
      #    username: ${{ secrets.DOCKERHUB_USERNAME }}
      #    password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          #images: |
          #  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          #  ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-xar-fetcher
        #run: |
        #  ./build.sh \
        #    --secret id=GITHUB_API_TOKEN,env=${{ secrets.GITHUB_TOKEN }} \
        #    --build-arg EDIROM_OWNER=baz-ga \
        #    --build-arg EDIROM_REF=bazga/candidate \
        #    --build-arg EDIROM_VERSION_STRATEGY=2.0.0 \
        #    --target xar-fetcher \
        #    -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          #push: ${{ github.event_name != 'pull_request' }}
          push: false
          platforms: |
            linux/amd64
            linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EDIROM_OWNER=baz-ga
            EDIROM_REF=bazga/candidate
            EDIROM_VERSION_STRATEGY=2.0.0
          secrets: |
            "GITHUB_API_TOKEN=${{ secrets.GITHUB_TOKEN }}"

      - name: Debug build outputs
        if: github.event_name != 'pull_request'
        run: |
          echo "Digest: ${{ steps.build-xar-fetcher.outputs.digest }}"
          echo "ImageID: ${{ steps.build-xar-fetcher.outputs.imageid }}"
          echo "Metadata: ${{ steps.build-xar-fetcher.outputs.metadata }}"

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the images with GitHub OIDC Token
        if: github.event_name != 'pull_request' && steps.build-xar-fetcher.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build-xar-fetcher.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "Error: DIGEST is empty. Skipping signing."
            exit 1
          fi
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          echo "Signing images: ${images}"
          cosign sign --yes ${images}
